# ── 운영 ───────────────────────────────────────────────────────────────────
#   ⚠ Mock 스키마 자동 적재를 반드시 끈다. 실제 보라미(또는 I/F 뷰)에 붙는 환경에서
#     schema-borami-mock.sql 이 돌면 DROP TABLE 이 실행된다.
spring:
  sql:
    init:
      mode: never

voice:
  source:
    mode: ${VOICE_SOURCE_MODE:ESB_HTTP2DB}
    # DIRECT_JDBC 로 내릴 때 붙는 실 보라미(Oracle). 원장 DB 직접 접근은 금지되어 있어 I/F 뷰 확정 전에는 쓰지 않는다.
    direct-db:
      url: ${DB_URL}
      driver-class-name: ${DB_DRIVER:oracle.jdbc.OracleDriver}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
  broker:
    mode: ${VOICE_BROKER_MODE:REST}
  stt:
    mode: ${VOICE_STT_MODE:NPU}
  decrypt:
    mode: ${VOICE_DECRYPT_MODE:REAL}

  dirs:
    base-dir: ${VOICE_BASE_DIR:/k8s}
    receive-meet: ${VOICE_MEET_DIR:${voice.dirs.base-dir}/voice_raw/meet}
    receive-phone: ${VOICE_PHONE_DIR:${voice.dirs.base-dir}/voice_raw/phone}
    work: ${VOICE_WORK_DIR:${voice.dirs.base-dir}/voice_work}
    output-meet: ${VOICE_OUTPUT_MEET_DIR:${voice.dirs.base-dir}/xenon/voice}
    output-phone: ${VOICE_OUTPUT_PHONE_DIR:${voice.dirs.base-dir}/xenon/phone}

  batch:
    schedule-enabled: ${VOICE_SCHEDULE_ENABLED:true}
    retain-source-file: false     # 복호화된 원본 음성은 STT 후 지운다

log-collector:
  enabled: true
  base-url: ${LOG_COLLECTOR_BASE_URL}

logging:
  level:
    egovframework.voice.collector: INFO
